<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" role="img" aria-labelledby="title desc">
  <title id="title">Lab Engagement badge flow preview</title>
  <desc id="desc">Illustrative preview of the badge catalog, member nomination, admin review, and awarded profile badge using fictional member data.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202939; }
    .muted { fill: #667085; }
    .eyebrow { fill: #596579; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .heading { font-size: 23px; font-weight: 700; }
    .body { font-size: 18px; }
    .small { font-size: 16px; }
    .button { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 2; }
    .inner { fill: #f8fafc; stroke: #d8dee8; stroke-width: 2; }
  </style>
  <rect width="1240" height="850" fill="#f2f5f9"/>
  <text x="42" y="54" font-size="30" font-weight="700">Lab Engagement</text>
  <text x="42" y="83" class="muted body">Illustrative AdminBot preview · fictional member · existing badge flow</text>

  <rect class="panel" x="38" y="112" width="568" height="330" rx="16"/>
  <text x="62" y="150" class="eyebrow">1  BADGE CATALOG</text>
  <text x="62" y="188" class="heading">Community Building</text>
  <rect class="inner" x="62" y="209" width="520" height="205" rx="12"/>
  <circle cx="91" cy="244" r="13" fill="#dbeafe"/>
  <path d="M85 245l4 4 8-10" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="250" font-size="21" font-weight="700">Lab Engagement</text>
  <text x="84" y="288" class="muted body">Has talked to Zhijing face-to-face in at least</text>
  <text x="84" y="315" class="muted body">three group meeting occasions, including in</text>
  <text x="84" y="342" class="muted body">person and online.</text>
  <text x="84" y="390" class="muted small">Available for member self-nomination</text>

  <rect class="panel" x="634" y="112" width="568" height="330" rx="16"/>
  <text x="658" y="150" class="eyebrow">2  MEMBER NOMINATION</text>
  <text x="658" y="188" class="heading">Self-nominate for badges</text>
  <rect class="inner" x="658" y="209" width="520" height="66" rx="10"/>
  <circle cx="685" cy="242" r="9" fill="#2563eb"/>
  <circle cx="685" cy="242" r="4" fill="#ffffff"/>
  <text x="708" y="248" class="body">Lab Engagement</text>
  <text x="658" y="307" class="small" font-weight="700">Evidence</text>
  <rect x="658" y="321" width="350" height="79" rx="9" fill="#ffffff" stroke="#aeb8c8" stroke-width="2"/>
  <text x="674" y="350" class="muted small">Sep 3, Sep 10, Sep 17 — group meetings</text>
  <text x="674" y="374" class="muted small">with Zhijing (example)</text>
  <rect x="1023" y="343" width="155" height="48" rx="9" fill="#2563eb"/>
  <text x="1100" y="374" class="button" text-anchor="middle">Submit</text>

  <rect class="panel" x="38" y="468" width="568" height="330" rx="16"/>
  <text x="62" y="506" class="eyebrow">3  ADMIN REVIEW</text>
  <text x="62" y="544" class="heading">Badge nominations</text>
  <rect class="inner" x="62" y="565" width="520" height="205" rx="12"/>
  <text x="84" y="600" font-size="20" font-weight="700">Alex Chen</text>
  <rect x="449" y="578" width="111" height="32" rx="16" fill="#fff0d9"/>
  <text x="504" y="600" fill="#8a5814" text-anchor="middle" class="small">Pending</text>
  <text x="84" y="633" class="muted body">Lab Engagement · self-nominated</text>
  <text x="84" y="664" class="small">Evidence: Sep 3, Sep 10, Sep 17 meetings</text>
  <rect x="84" y="695" width="120" height="46" rx="9" fill="#2563eb"/>
  <text x="144" y="724" class="button" text-anchor="middle">Approve</text>
  <rect x="217" y="695" width="106" height="46" rx="9" fill="#ffffff" stroke="#aeb8c8" stroke-width="2"/>
  <text x="270" y="724" font-size="17" font-weight="700" text-anchor="middle">Reject</text>

  <rect class="panel" x="634" y="468" width="568" height="330" rx="16"/>
  <text x="658" y="506" class="eyebrow">4  MEMBER PROFILE AFTER APPROVAL</text>
  <text x="658" y="544" class="heading">Alex Chen</text>
  <text x="658" y="583" class="muted body">Badges</text>
  <rect x="658" y="602" width="213" height="42" rx="21" fill="#ffffff" stroke="#aeb8c8" stroke-width="2"/>
  <circle cx="682" cy="623" r="9" fill="#dbeafe"/>
  <text x="703" y="630" font-size="17" font-weight="700">Lab Engagement</text>
  <rect class="inner" x="658" y="665" width="520" height="105" rx="10"/>
  <text x="677" y="695" class="small" font-weight="700">Badge explanation</text>
  <text x="677" y="723" class="muted small">Has talked to Zhijing face-to-face in at least three</text>
  <text x="677" y="747" class="muted small">group meeting occasions, including in person and online.</text>
</svg>
