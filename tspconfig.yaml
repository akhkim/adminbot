emit:
  - "@typespec/openapi3"
  - "@typespec/json-schema"

output-dir: "{project-root}/.generated"

options:
  "@typespec/openapi3":
    emitter-output-dir: "{output-dir}/openapi"
    file-type: "json"
    openapi-versions:
      - "3.1.0"
    operation-id-strategy: "fqn"
    seal-object-schemas: true
  "@typespec/json-schema":
    emitter-output-dir: "{output-dir}/json-schema"
    file-type: "json"
    emitAllModels: true
    emitAllRefs: true
    seal-object-schemas: true
    polymorphic-models-strategy: "oneOf"
